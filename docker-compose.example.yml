# EXAMPLE ONLY. A generic setup that matches the container names used in this project (n8n, ollama).
# It is not a copy of a private file. Change it to fit your computer.
# Do not put real passwords or keys in a file you commit to GitHub. Use a local .env file instead.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
  ollama_data:
